[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miadi-stateloom-engine"
version = "0.2.0"
description = "Stateloom engine (Python) — design, generate, and run hierarchical state machines from SMDF"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Guillaume Isabelle", email = "jgi@jgwill.com" }]
keywords = ["state-machine", "code-generator", "fsm", "hierarchical", "stateloom", "smdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
smcg = "stateloom.cli:main"

[tool.setuptools.packages.find]
include = ["stateloom*"]

[project.urls]
Homepage = "https://github.com/jgwill/smcraft"
Repository = "https://github.com/jgwill/smcraft"
Issues = "https://github.com/jgwill/smcraft/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
