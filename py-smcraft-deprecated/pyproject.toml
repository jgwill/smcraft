[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smcraft"
version = "0.1.7"
description = "Renamed to miadi-stateloom-engine. This release is a compatibility shim that re-exports it."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Guillaume Isabelle", email = "jgi@jgwill.com" }]
keywords = ["state-machine", "deprecated", "renamed", "stateloom", "smdf"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["miadi-stateloom-engine>=0.2.1"]

[project.urls]
Homepage = "https://github.com/jgwill/smcraft"
Repository = "https://github.com/jgwill/smcraft"
Issues = "https://github.com/jgwill/smcraft/issues"

# No [project.scripts]: `smcg` belongs to miadi-stateloom-engine now. Declaring
# it here too would make the installed command depend on which package was
# installed last.

[tool.setuptools.packages.find]
include = ["smcraft*"]
